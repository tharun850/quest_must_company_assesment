<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayLedger — Team Expense Tracker</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1a1a2e; }
  header { background: #1a1a2e; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f3; }
  th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .amount { text-align: right; font-variant-numeric: tabular-nums; }
  .total-row { font-weight: 700; background: #fafbfc; }
  select { padding: 6px 10px; border-radius: 6px; border: 1px solid #ccd; font-size: 14px; }
  .muted { color: #888; font-size: 13px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
</style>
</head>
<body>
<header><h1>PayLedger — Team Expense Tracker</h1></header>
<main>
  <div class="card">
    <h2>Daily Summary</h2>
    <p class="muted">Totals per day across all recorded payments.</p>
    <table id="summaryTable">
      <thead><tr><th>Date</th><th>Payments</th><th class="amount">Total (USD)</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Payments on <select id="daySelect"></select></h2>
    <table id="detailTable">
      <thead><tr><th>Time</th><th>Payee</th><th>Memo</th><th class="amount">Amount (USD)</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="detailTotal" class="muted"></p>
  </div>
</main>

<script>
// ---- PayLedger v0.3 ----------------------------------------------------
// Payments are recorded by the mobile client with the user's local
// timestamp (our pilot team is in Chennai, UTC+05:30).

const PAYMENTS = [
  { id: 1,  ts: "2026-07-11T09:12:00+05:30", payee: "Kavya S",   memo: "Team lunch",        amount: 42.10 },
  { id: 2,  ts: "2026-07-11T15:47:00+05:30", payee: "Rohan M",   memo: "Cloud credits",     amount: 120.00 },
  { id: 3,  ts: "2026-07-11T22:05:00+05:30", payee: "Kavya S",   memo: "Taxi (client)",     amount: 18.30 },
  { id: 4,  ts: "2026-07-12T00:25:00+05:30", payee: "Imran V",   memo: "Late-night deploy pizza", amount: 27.60 },
  { id: 5,  ts: "2026-07-12T10:00:00+05:30", payee: "Rohan M",   memo: "Monitor arm",       amount: 89.99 },
  { id: 6,  ts: "2026-07-12T18:31:00+05:30", payee: "Priya D",   memo: "Courier",           amount: 12.75 },
  { id: 7,  ts: "2026-07-13T01:05:00+05:30", payee: "Imran V",   memo: "On-call cab home",  amount: 22.40 },
  { id: 8,  ts: "2026-07-13T04:50:00+05:30", payee: "Priya D",   memo: "Airport transfer",  amount: 61.00 },
  { id: 9,  ts: "2026-07-13T11:20:00+05:30", payee: "Kavya S",   memo: "Stationery",        amount: 9.45 },
  { id: 10, ts: "2026-07-13T20:15:00+05:30", payee: "Rohan M",   memo: "Client dinner",     amount: 148.20 },
  { id: 11, ts: "2026-07-14T00:40:00+05:30", payee: "Kavya S",   memo: "Overtime meal",     amount: 15.10 },
  { id: 12, ts: "2026-07-14T13:03:00+05:30", payee: "Imran V",   memo: "USB-C hub",         amount: 34.50 },
  { id: 13, ts: "2026-07-14T19:55:00+05:30", payee: "Priya D",   memo: "Printing",          amount: 6.20 },
  { id: 14, ts: "2026-07-15T02:10:00+05:30", payee: "Rohan M",   memo: "Incident-night cab",amount: 19.80 },
  { id: 15, ts: "2026-07-15T12:45:00+05:30", payee: "Kavya S",   memo: "Team snacks",       amount: 23.35 },
  { id: 16, ts: "2026-07-15T21:30:00+05:30", payee: "Imran V",   memo: "Software license",  amount: 210.00 },
];

// Group payments by calendar day for the summary table.
function summarize(payments) {
  const buckets = {};
  for (const p of payments) {
    const day = p.ts.slice(0, 10);
    if (!buckets[day]) buckets[day] = { count: 0, total: 0 };
    buckets[day].count += 1;
    buckets[day].total += p.amount;
  }
  return buckets;
}

// The day a payment belongs to, as shown to the user.
function displayDay(p) {
  return p.ts.slice(0, 10);
}

function displayTime(p) {
  return p.ts.slice(11, 16);
}

function renderSummary() {
  const buckets = summarize(PAYMENTS);
  const tbody = document.querySelector("#summaryTable tbody");
  tbody.innerHTML = "";
  for (const day of Object.keys(buckets).sort()) {
    const b = buckets[day];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${day}</td><td>${b.count}</td><td class="amount">$${b.total.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  }
}

function renderDetail(day) {
  const rows = PAYMENTS.filter(p => displayDay(p) === day);
  const tbody = document.querySelector("#detailTable tbody");
  tbody.innerHTML = "";
  let total = 0;
  for (const p of rows) {
    total += p.amount;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${displayTime(p)}</td><td>${p.payee}</td><td>${p.memo}</td><td class="amount">$${p.amount.toFixed(2)}</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById("detailTotal").textContent =
    rows.length + " payment(s), day total $" + total.toFixed(2);
}

function initDaySelect() {
  const days = [...new Set(PAYMENTS.map(displayDay))].sort();
  const sel = document.getElementById("daySelect");
  for (const d of days) {
    const opt = document.createElement("option");
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  }
  sel.addEventListener("change", () => renderDetail(sel.value));
  renderDetail(days[0]);
}

renderSummary();
initDaySelect();
</script>
</body>
</html>
